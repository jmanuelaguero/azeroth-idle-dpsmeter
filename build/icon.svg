<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Original artwork for Azeroth Meter: a diagonal sword on a beveled frame (not derived from Blizzard assets). -->
  <defs>
    <linearGradient id="bevel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8956a"/>
      <stop offset="0.5" stop-color="#4c402a"/>
      <stop offset="1" stop-color="#15110a"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#5a1f12"/>
      <stop offset="0.55" stop-color="#2a0f09"/>
      <stop offset="1" stop-color="#0b0503"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff4a00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bladeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f7fb"/>
      <stop offset="1" stop-color="#aab4c0"/>
    </linearGradient>
    <linearGradient id="bladeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c8794"/>
      <stop offset="1" stop-color="#3d4550"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0b0"/>
      <stop offset="0.5" stop-color="#d9a032"/>
      <stop offset="1" stop-color="#7a4a0c"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a4a24"/>
      <stop offset="1" stop-color="#3a1f0c"/>
    </linearGradient>
  </defs>

  <!-- beveled square frame -->
  <rect x="0" y="0" width="256" height="256" rx="14" fill="url(#bevel)"/>
  <rect x="10" y="10" width="236" height="236" rx="8" fill="#000"/>
  <rect x="13" y="13" width="230" height="230" rx="6" fill="url(#bg)"/>
  <circle cx="128" cy="128" r="110" fill="url(#glow)"/>

  <!-- sword, drawn pointing up, rotated to the classic diagonal -->
  <g transform="rotate(45 128 128)">
    <!-- blade: light and dark halves give the bevel along the fuller -->
    <path d="M128 18 L144 46 L144 164 L128 164 Z" fill="url(#bladeR)"/>
    <path d="M128 18 L112 46 L112 164 L128 164 Z" fill="url(#bladeL)"/>
    <path d="M128 40 L128 160" stroke="#5b6672" stroke-width="3"/>
    <path d="M128 18 L144 46 L144 164 L112 164 L112 46 Z" fill="none" stroke="#14181d" stroke-width="3" stroke-linejoin="round"/>

    <!-- crossguard -->
    <path d="M84 164 L172 164 L180 172 L172 180 L84 180 L76 172 Z" fill="url(#gold)" stroke="#3d2606" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="128" cy="172" r="7" fill="#b3261e" stroke="#3d2606" stroke-width="2"/>

    <!-- grip with leather wraps -->
    <rect x="119" y="180" width="18" height="40" fill="url(#grip)" stroke="#1e0f05" stroke-width="2.5"/>
    <path d="M119 188 L137 194 M119 198 L137 204 M119 208 L137 214" stroke="#24120a" stroke-width="2.5"/>

    <!-- pommel -->
    <circle cx="128" cy="228" r="11" fill="url(#gold)" stroke="#3d2606" stroke-width="3"/>
  </g>

  <!-- inner frame highlight -->
  <rect x="13" y="13" width="230" height="230" rx="6" fill="none" stroke="#d6bd86" stroke-opacity="0.35" stroke-width="2"/>
</svg>
