name: Release

# Push a version tag (e.g. `git tag v1.0.0 && git push origin v1.0.0`) to build, scan and publish a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build installer and portable exe
        run: npm run dist

      - name: Virus scan with Microsoft Defender
        shell: pwsh
        run: |
          $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          & $mp -SignatureUpdate | Out-Null
          $status = Get-MpComputerStatus
          $report = @("| File | Microsoft Defender |", "|---|---|")
          foreach ($exe in Get-ChildItem dist -Filter *.exe) {
            & $mp -Scan -ScanType 3 -File $exe.FullName -DisableRemediation | Out-Host
            switch ($LASTEXITCODE) {
              0 { $report += "| ``$($exe.Name)`` | ✅ No threats found |" }
              2 { throw "Microsoft Defender flagged $($exe.Name) - release aborted." }
              default { throw "Microsoft Defender scan failed for $($exe.Name) (exit code $LASTEXITCODE)." }
            }
          }
          $report += ""
          $report += "Engine $($status.AMEngineVersion) · signatures $($status.AntivirusSignatureVersion) ($($status.AntivirusSignatureLastUpdated.ToString('yyyy-MM-dd')))"
          $report -join "`n" | Out-File -Encoding utf8 scan-report.md

      - name: Compute SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter *.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Write release notes
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $sums = (Get-Content dist/SHA256SUMS.txt -Raw).Trim()
          $scan = (Get-Content scan-report.md -Raw).Trim()
          $fence = '```'
          $notes = @(
            '## Download',
            '',
            '| File | What it is |',
            '|---|---|',
            "| **AzerothMeter-Setup-$version.exe** | Installer (recommended). Installs in seconds and adds a desktop shortcut. |",
            "| **AzerothMeter-$version-portable.exe** | No install needed, just run it. |",
            '',
            '**First time:** open Azeroth Idle and type `/combatlog` in the chat. The meter starts showing data as soon as you fight.',
            '',
            'Windows may show *"Windows protected your PC"* because the app is not code-signed: click **More info → Run anyway**.',
            '',
            '## Virus scan',
            '',
            $scan,
            '',
            '## SHA-256',
            '',
            $fence,
            $sums,
            $fence
          )
          $notes -join "`n" | Out-File -Encoding utf8 release-notes.md
          Get-Content release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Azeroth Meter ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt

      # Optional second opinion: add a free VirusTotal API key as the VT_API_KEY repository secret.
      # Uploads each exe (large-file endpoint, the exes are > 32 MB), waits for the engines to finish,
      # appends the results to the release notes and refreshes the README badges on main.
      - name: Scan with VirusTotal (optional)
        if: env.VT_API_KEY != ''
        timeout-minutes: 45
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ 'x-apikey' = $env:VT_API_KEY }
          $api = 'https://www.virustotal.com/api/v3'
          $results = @()
          foreach ($exe in Get-ChildItem dist -Filter *.exe) {
            $sha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
            $uploadUrl = (Invoke-RestMethod -Headers $headers -Uri "$api/files/upload_url").data
            curl.exe --silent --show-error --fail -H "x-apikey: $env:VT_API_KEY" -F "file=@$($exe.FullName)" $uploadUrl | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "VirusTotal upload failed for $($exe.Name)" }

            # Wait until the analysis of this exact file is complete (free API: max 4 requests/minute).
            $stats = $null
            for ($i = 0; $i -lt 30 -and -not $stats; $i++) {
              Start-Sleep -Seconds 40
              try {
                $file = Invoke-RestMethod -Headers $headers -Uri "$api/files/$sha"
                $s = $file.data.attributes.last_analysis_stats
                $engines = $s.malicious + $s.suspicious + $s.undetected + $s.harmless
                if ($file.data.attributes.last_analysis_date -and $engines -ge 40) { $stats = $s; $total = $engines }
              } catch { Write-Host "waiting for VirusTotal analysis of $($exe.Name)..." }
            }
            if (-not $stats) { throw "VirusTotal analysis of $($exe.Name) did not finish in time" }
            $flagged = $stats.malicious + $stats.suspicious
            Write-Host "$($exe.Name): $flagged/$total"
            $results += [pscustomobject]@{ Name = $exe.Name; Sha = $sha; Flagged = $flagged; Total = $total }
          }

          # Release notes: append a VirusTotal table.
          $table = @('', '## VirusTotal', '', '| File | Detections | Report |', '|---|---|---|')
          foreach ($r in $results) {
            $table += "| ``$($r.Name)`` | $($r.Flagged)/$($r.Total) | [View report](https://www.virustotal.com/gui/file/$($r.Sha)) |"
          }
          $body = (gh release view "${{ github.ref_name }}" --json body --jq .body) -join "`n"
          ($body + "`n" + ($table -join "`n")) | Out-File -Encoding utf8 vt-notes.md
          gh release edit "${{ github.ref_name }}" --notes-file vt-notes.md

          # README badges between the vt-badges markers, committed to main.
          $badges = foreach ($r in $results) {
            $kind = if ($r.Name -like '*portable*') { 'portable' } else { 'installer' }
            $color = if ($r.Flagged -eq 0) { 'brightgreen' } else { 'red' }
            $label = [uri]::EscapeDataString("VirusTotal ($kind)")
            $msg = [uri]::EscapeDataString("$($r.Flagged)/$($r.Total) detections")
            "[![VirusTotal $kind](https://img.shields.io/badge/$($label)-$($msg)-$($color)?logo=virustotal&logoColor=white)](https://www.virustotal.com/gui/file/$($r.Sha))"
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B main origin/main
          $readme = Get-Content README.md -Raw
          $block = "<!-- vt-badges:start -->`n" + ($badges -join "`n") + "`n<!-- vt-badges:end -->"
          $readme = [regex]::Replace($readme, '(?s)<!-- vt-badges:start -->.*?<!-- vt-badges:end -->', $block)
          [IO.File]::WriteAllText("$PWD/README.md", $readme)
          git add README.md
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "docs: update VirusTotal badges for ${{ github.ref_name }}"
            git push origin main
          }
